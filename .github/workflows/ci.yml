name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,deep,dashboard]"

      - name: Run Python tests
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check src tests scripts dashboard

      - name: Build and validate Python distributions
        run: |
          python -m build
          python -m twine check dist/*

  go:
    name: Go API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway-go
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/api-gateway-go/go.mod

      - name: Run Go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Run Go vulnerability analysis
        run: CGO_ENABLED=0 go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run Go tests
        run: CGO_ENABLED=0 go test ./...

      - name: Run Go race tests
        run: CGO_ENABLED=1 go test -race ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/stock-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/stock-dashboard/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

  e2e:
    name: Watchlist-to-warning E2E
    runs-on: ubuntu-latest
    env:
      TSI_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsi_e2e
      TSI_E2E_API_BINARY: /tmp/tsi-api-gateway
      TSI_E2E_ANALYSIS_PATH: /tmp/tsi-analysis.json
      TSI_E2E_API_PORT: "18081"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tsi_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsi_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,db]"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/api-gateway-go/go.mod

      - name: Build Go API binary
        working-directory: services/api-gateway-go
        run: CGO_ENABLED=0 go build -o /tmp/tsi-api-gateway ./cmd/server

      - name: Run deterministic watchlist-to-warning pipeline
        run: python -m pytest tests/test_e2e_watchlist_warning_pipeline.py -q

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/stock-dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/stock-dashboard
        run: npm ci

      - name: Validate Go API payload with frontend runtime schema
        working-directory: frontend/stock-dashboard
        run: npm test -- --run src/lib/e2ePayload.test.ts
