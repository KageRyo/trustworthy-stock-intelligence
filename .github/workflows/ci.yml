name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deep]"

      - name: Run Python tests
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check src tests scripts dashboard

  go:
    name: Go API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway-go
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/api-gateway-go/go.mod

      - name: Run Go tests
        run: CGO_ENABLED=0 go test ./...
