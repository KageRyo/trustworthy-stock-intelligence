[project]
name = "trustworthy-stock-intelligence"
version = "0.4.1"
description = "Leakage-aware and trust-aware tools for stock drawdown-risk analysis."
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "KageRyo" }
]
keywords = [
  "stock risk",
  "drawdown",
  "financial machine learning",
  "calibration",
  "uncertainty",
  "trustworthy ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "joblib>=1.3",
  "scikit-learn>=1.4",
  "pydantic>=2.7",
]

[project.optional-dependencies]
models = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "imbalanced-learn>=0.12",
  "statsmodels>=0.14",
  "optuna>=3.6",
]
explainability = [
  "shap>=0.45",
]
viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
]
notebooks = [
  "jupyterlab>=4.2",
  "notebook>=7.2",
  "ipykernel>=6.29",
]
data = [
  "lxml>=5.0",
  "pandas-market-calendars>=4.4",
  "requests>=2.31",
  "ta>=0.11",
  "yfinance>=0.2",
]
db = [
  "psycopg[binary]>=3.2",
]
deep = [
  "torch>=2.7",
  "torchvision>=0.22",
  "torchaudio>=2.7",
  "tensorboard>=2.16",
]
dashboard = [
  "streamlit>=1.36",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.15,<0.17",
  "twine>=6.0",
  "uv>=0.11",
]

[project.urls]
Homepage = "https://github.com/KageRyo/trustworthy-stock-intelligence"
Repository = "https://github.com/KageRyo/trustworthy-stock-intelligence"
Documentation = "https://github.com/KageRyo/trustworthy-stock-intelligence/tree/main/docs"
Issues = "https://github.com/KageRyo/trustworthy-stock-intelligence/issues"
Changelog = "https://github.com/KageRyo/trustworthy-stock-intelligence/blob/main/CHANGELOG.md"

[project.scripts]
tsi = "tsi.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Preserve the pre-0.16 default baseline; adopt additional rules in focused changes.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
