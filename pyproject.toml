[project]
name = "trustworthy-stock-intelligence"
version = "0.1.0"
description = "A research-oriented framework for trustworthy stock risk early-warning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "KageRyo" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "yfinance>=0.2",
]

[project.optional-dependencies]
models = [
  "xgboost>=2.0",
]
explainability = [
  "shap>=0.45",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
