name: sp100_risk
description: Primary v0 research dataset for S&P 100 stock risk early-warning.
universe: S&P 100
frequency: daily
data_source:
  pilot: Yahoo Finance
  formal_research_preferred:
    - WRDS/CRSP
    - Polygon
    - Tiingo
    - official exchange data
schema:
  - date
  - ticker
  - open
  - high
  - low
  - close
  - adj_close
  - volume
features:
  - daily OHLCV
  - technical indicators
  - market index features
label:
  task: 5-day drawdown risk warning
  horizon_trading_days: 5
  future_max_drawdown_threshold: -0.05
split:
  protocol: walk-forward
  random_split_allowed: false
