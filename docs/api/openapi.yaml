openapi: 3.1.0
info:
  title: Trustworthy Stock Intelligence API
  version: 0.3.2
  summary: PostgreSQL-backed warning, watchlist, and ticker analysis API.
  description: |
    The API serves stock drawdown-risk warning records generated by the Python
    ML core and stored in PostgreSQL. When configured, ticker analysis can
    trigger an on-demand Python analysis command before returning.
servers:
  - url: http://127.0.0.1:18080
    description: Local development API
tags:
  - name: Health
  - name: Providers
  - name: Warnings
  - name: Watchlists
  - name: Analysis
  - name: Models
  - name: Prediction Jobs
paths:
  /openapi.yaml:
    get:
      tags: [Health]
      summary: Read the OpenAPI specification.
      operationId: getOpenAPISpec
      responses:
        "200":
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string
  /swagger:
    get:
      tags: [Health]
      summary: Read Swagger UI.
      operationId: getSwaggerUI
      responses:
        "200":
          description: Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
  /swagger/:
    get:
      tags: [Health]
      summary: Read Swagger UI.
      operationId: getSwaggerUITrailingSlash
      responses:
        "200":
          description: Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      tags: [Health]
      summary: Read gateway health.
      operationId: getHealth
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      tags: [Health]
      summary: Read Prometheus-style metrics.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text metrics.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/status:
    get:
      tags: [Health]
      summary: Read warning store reload status.
      operationId: getStatus
      responses:
        "200":
          description: Store status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"
  /api/v1/providers/health:
    get:
      tags: [Providers]
      summary: Read persisted provider health and ticker coverage.
      operationId: getProviderHealth
      responses:
        "200":
          description: Latest provider health observations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/prediction-jobs:
    post:
      tags: [Prediction Jobs]
      summary: Queue asynchronous prediction work.
      description: |
        Creates or returns an idempotent PostgreSQL-backed prediction job. The
        API acknowledges queued work with 202; a separate Python worker claims
        and executes it.
      operationId: createPredictionJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionJobCreateRequest"
      responses:
        "202":
          description: Prediction work was queued or an existing idempotent job was returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/prediction-jobs/{id}:
    get:
      tags: [Prediction Jobs]
      summary: Read asynchronous prediction job status.
      operationId: getPredictionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current prediction job state and result metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/warnings/latest:
    get:
      tags: [Warnings]
      summary: Read latest warning records.
      operationId: getLatestWarnings
      parameters:
        - name: level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WarningLevel"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [trust_score, calibrated_risk_probability, uncertainty_score]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Latest prediction batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/tickers:
    get:
      tags: [Warnings]
      summary: Read ticker coverage in the latest loaded warning batch.
      description: |
        This endpoint reports only the tickers present in the currently loaded
        prediction batch. It is not a complete market universe endpoint.
      operationId: getTickers
      responses:
        "200":
          description: Latest loaded ticker list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerListResponse"
  /api/v1/watchlists/{name}:
    get:
      tags: [Watchlists]
      summary: Read a user-managed watchlist.
      operationId: getWatchlist
      parameters:
        - $ref: "#/components/parameters/WatchlistNamePath"
      responses:
        "200":
          description: Watchlist state with latest warning joins where available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/watchlists/{name}/tickers:
    post:
      tags: [Watchlists]
      summary: Add a ticker to a watchlist.
      operationId: addWatchlistTicker
      parameters:
        - $ref: "#/components/parameters/WatchlistNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAddTickerRequest"
      responses:
        "201":
          description: Updated watchlist state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/watchlists/{name}/tickers/{ticker}:
    delete:
      tags: [Watchlists]
      summary: Remove a ticker from a watchlist.
      operationId: removeWatchlistTicker
      parameters:
        - $ref: "#/components/parameters/WatchlistNamePath"
        - $ref: "#/components/parameters/TickerPath"
      responses:
        "200":
          description: Updated watchlist state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/warnings/{ticker}:
    get:
      tags: [Warnings]
      summary: Read one latest warning record for a ticker.
      operationId: getTickerWarning
      parameters:
        - $ref: "#/components/parameters/TickerPath"
      responses:
        "200":
          description: Ticker warning record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionRecord"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/analysis/{ticker}:
    get:
      tags: [Analysis]
      summary: Read typed dashboard analysis for a ticker.
      description: |
        Returns a dashboard-oriented analysis response built from the latest
        warning record for the requested ticker. Supports alphabetic tickers
        such as `NVDA` and numeric Taiwan stock codes such as `2330`. If the
        ticker is not already present and on-demand analysis is configured, the
        API downloads the ticker data, runs the Python prediction command, writes
        the result to PostgreSQL, refreshes the store, and then responds.
      operationId: getTickerAnalysis
      parameters:
        - $ref: "#/components/parameters/TickerPath"
      responses:
        "200":
          description: Ticker analysis response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerAnalysisResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/analysis/{ticker}/history:
    get:
      tags: [Analysis]
      summary: Read historical risk and trust observations for a ticker.
      description: Returns chronological warning observations retained in PostgreSQL.
      operationId: getTickerWarningHistory
      parameters:
        - $ref: "#/components/parameters/TickerPath"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3650
            default: 90
      responses:
        "200":
          description: Chronological ticker warning history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/analysis/{ticker}/transitions:
    get:
      tags: [Analysis]
      summary: Read warning state transitions for a ticker.
      description: Repeated identical warning snapshots do not create duplicate transition events.
      operationId: getTickerWarningTransitions
      parameters:
        - $ref: "#/components/parameters/TickerPath"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3650
            default: 90
      responses:
        "200":
          description: Persisted warning transitions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningTransitionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/models/current:
    get:
      tags: [Models]
      summary: Read current model metadata.
      operationId: getCurrentModel
      responses:
        "200":
          description: Current model metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentModelResponse"
components:
  parameters:
    TickerPath:
      name: ticker
      in: path
      required: true
      description: Alphabetic ticker or numeric Taiwan stock code.
      schema:
        type: string
        minLength: 1
        examples: ["NVDA", "2330"]
    WatchlistNamePath:
      name: name
      in: path
      required: true
      description: Watchlist name. The local dashboard uses browser-session names such as `session-...`; no JWT is required for this local workflow.
      schema:
        type: string
        minLength: 1
        examples: ["session-7d2f5d0c-5b20-4f6b-a7a7-6e59cbd7a3bd"]
  responses:
    BadRequest:
      description: Invalid request parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ticker was not found and could not be generated on demand.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required backing store or on-demand analysis command is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    WarningLevel:
      type: string
      enum: [alert, watch, abstain, no_alert]
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - warnings_loaded
        - schema_version
        - run_id
        - data_as_of
        - generated_at
        - record_count
      properties:
        status:
          type: string
          examples: [ok]
        warnings_loaded:
          type: boolean
        schema_version:
          type: string
        run_id:
          type: string
        data_as_of:
          type: string
          format: date
        generated_at:
          type: string
        record_count:
          type: integer
          minimum: 0
        last_error:
          type: string
    ProviderHealthResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - generated_at
        - record_count
        - records
      properties:
        schema_version:
          type: string
          const: provider_health.v1
        generated_at:
          type: string
          format: date-time
        record_count:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHealthRecord"
    ProviderHealthRecord:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - provider
        - market
        - ticker
        - query_symbol
        - status
        - coverage
        - attempt_count
        - success_count
        - failure_count
        - consecutive_failures
        - observed_at
      properties:
        schema_version:
          type: string
          const: provider_health.v1
        provider:
          type: string
        market:
          type: string
          enum: [us, twse, tpex, emerging, taiwan, unknown]
        ticker:
          type: string
        query_symbol:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unavailable]
        coverage:
          type: string
          enum: [available, partial, unavailable, unknown]
        attempt_count:
          type: integer
          minimum: 0
        success_count:
          type: integer
          minimum: 0
        failure_count:
          type: integer
          minimum: 0
        consecutive_failures:
          type: integer
          minimum: 0
        last_success_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_latency_ms:
          type: number
          minimum: 0
        last_error_code:
          type: string
        last_error_message:
          type: string
        observed_at:
          type: string
          format: date-time
    PredictionJobCreateRequest:
      type: object
      additionalProperties: false
      required:
        - ticker
      properties:
        schema_version:
          type: string
          const: prediction_job_request.v1
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        ticker:
          type: string
          minLength: 1
          examples: ["NVDA", "2330"]
        market:
          type: string
          enum: [auto, us, twse, tpex, emerging]
          default: auto
        feature_interval:
          type: string
          enum: [1m, 5m, 1d]
          default: 1d
        max_attempts:
          type: integer
          minimum: 1
          maximum: 8
          default: 3
        request_payload:
          type: object
          additionalProperties: true
    PredictionJobResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - job
      properties:
        schema_version:
          type: string
          const: prediction_job.v1
        job:
          $ref: "#/components/schemas/PredictionJob"
    PredictionJob:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - idempotency_key
        - ticker
        - market
        - feature_interval
        - status
        - attempt_count
        - max_attempts
        - available_at
        - enqueued_at
        - created_at
        - updated_at
      properties:
        schema_version:
          type: string
          const: prediction_job.v1
        id:
          type: string
        idempotency_key:
          type: string
        ticker:
          type: string
        market:
          type: string
          enum: [auto, us, twse, tpex, emerging]
        feature_interval:
          type: string
          enum: [1m, 5m, 1d]
        status:
          $ref: "#/components/schemas/PredictionJobStatus"
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        available_at:
          type: string
          format: date-time
        enqueued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        worker_id:
          type: string
        locked_at:
          type: string
          format: date-time
        prediction_batch_id:
          type: string
        result_run_id:
          type: string
        failure_code:
          $ref: "#/components/schemas/PredictionJobFailureCode"
        failure_message:
          type: string
        request_payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PredictionJobStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]
    PredictionJobFailureCode:
      type: string
      enum:
        - provider_unavailable
        - insufficient_history
        - prediction_failed
        - stale_data
        - unsupported_market
        - unsupported_interval
        - database_error
        - worker_error
        - unknown
    WarningTransitionsResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - ticker
        - record_count
        - transitions
      properties:
        schema_version:
          type: string
          const: warning_transition.v1
        ticker:
          type: string
        record_count:
          type: integer
          minimum: 0
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/WarningTransition"
    WarningTransition:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - ticker
        - transition_type
        - current_warning_level
        - current_run_id
        - current_batch_id
        - detected_at
        - deduplication_key
      properties:
        schema_version:
          type: string
          const: warning_transition.v1
        id:
          type: string
        ticker:
          type: string
        transition_type:
          type: string
          enum: [new_watch, new_alert, upgraded, downgraded, resolved, persistent_alert, low_trust_warning]
        previous_warning_level:
          $ref: "#/components/schemas/WarningLevel"
        current_warning_level:
          $ref: "#/components/schemas/WarningLevel"
        previous_run_id:
          type: string
        current_run_id:
          type: string
        previous_batch_id:
          type: string
        current_batch_id:
          type: string
        detected_at:
          type: string
          format: date-time
        deduplication_key:
          type: string
    StoreStatus:
      type: object
      additionalProperties: false
      required:
        - warnings_path
        - warnings_loaded
        - schema_version
        - run_id
        - data_as_of
        - generated_at
        - record_count
        - last_loaded_at
        - file_modified_at
      properties:
        warnings_path:
          type: string
        warnings_loaded:
          type: boolean
        schema_version:
          type: string
        run_id:
          type: string
        data_as_of:
          type: string
        generated_at:
          type: string
        record_count:
          type: integer
          minimum: 0
        last_loaded_at:
          type: string
        file_modified_at:
          type: string
        last_error:
          type: string
    CurrentModelResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - run_id
        - data_as_of
        - model
        - model_bundle
        - generated_at
        - record_count
      properties:
        schema_version:
          type: string
        run_id:
          type: string
        data_as_of:
          type: string
        model:
          type: string
        model_bundle:
          type: string
        generated_at:
          type: string
        record_count:
          type: integer
          minimum: 0
    PredictionBatch:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - run_id
        - data_as_of
        - generated_at
        - record_count
        - calibration_drift
        - records
      properties:
        schema_version:
          type: string
          examples: [v1]
        run_id:
          type: string
        data_as_of:
          type: string
        generated_at:
          type: string
        feature_interval:
          type: string
          enum: [1m, 5m, 1d]
        record_count:
          type: integer
          minimum: 0
        calibration_drift:
          $ref: "#/components/schemas/CalibrationDriftMetadata"
        records:
          type: array
          items:
            $ref: "#/components/schemas/PredictionRecord"
    PredictionRecord:
      type: object
      additionalProperties: false
      required:
        - date
        - ticker
        - model
        - model_bundle
        - risk_probability
        - calibrated_risk_probability
        - calibration_method
        - uncertainty_score
        - trust_score
        - alert_threshold
        - watch_threshold
        - warning_level
        - reason_codes
        - feature_attributions
      properties:
        date:
          type: string
          format: date
        ticker:
          type: string
        model:
          type: string
        model_bundle:
          type: string
        risk_probability:
          type: number
          minimum: 0
          maximum: 1
        calibrated_risk_probability:
          type: number
          minimum: 0
          maximum: 1
        calibration_method:
          type: string
        uncertainty_score:
          type: number
          minimum: 0
          maximum: 1
        trust_score:
          type: number
          minimum: 0
          maximum: 1
        alert_threshold:
          type: number
          minimum: 0
          maximum: 1
        watch_threshold:
          type: number
          minimum: 0
          maximum: 1
        warning_level:
          $ref: "#/components/schemas/WarningLevel"
        reason_codes:
          type: array
          items:
            type: string
        feature_attributions:
          type: array
          items:
            $ref: "#/components/schemas/FeatureAttribution"
    TickerListResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - run_id
        - data_as_of
        - generated_at
        - record_count
        - tickers
      properties:
        schema_version:
          type: string
          const: ticker_list.v1
        run_id:
          type: string
        data_as_of:
          type: string
        generated_at:
          type: string
        record_count:
          type: integer
          minimum: 0
        tickers:
          type: array
          items:
            $ref: "#/components/schemas/TickerSummary"
    TickerSummary:
      type: object
      additionalProperties: false
      required:
        - ticker
        - market
        - date
        - warning_level
        - calibrated_risk_probability
        - trust_score
      properties:
        ticker:
          type: string
          examples: ["NVDA", "2330"]
        market:
          type: string
          enum: [us, taiwan, unknown]
        date:
          type: string
          format: date
        warning_level:
          $ref: "#/components/schemas/WarningLevel"
        calibrated_risk_probability:
          type: number
          minimum: 0
          maximum: 1
        trust_score:
          type: number
          minimum: 0
          maximum: 1
    WatchlistAddTickerRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - ticker
        - market
        - notes
      properties:
        schema_version:
          type: string
          const: watchlist_add.v1
        ticker:
          type: string
          examples: ["NVDA", "2330"]
        market:
          type: string
          enum: [auto, us, twse, tpex, emerging]
        notes:
          type: string
    WatchlistResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - name
        - record_count
        - updated_at
        - tickers
      properties:
        schema_version:
          type: string
          const: watchlist.v1
        name:
          type: string
        record_count:
          type: integer
          minimum: 0
        updated_at:
          type: string
        tickers:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistTicker"
    WatchlistTicker:
      type: object
      additionalProperties: false
      required:
        - ticker
        - query_symbol
        - market
        - added_at
        - notes
        - has_latest_warning
      properties:
        ticker:
          type: string
        query_symbol:
          type: string
        market:
          type: string
          enum: [us, twse, tpex, emerging, taiwan, unknown]
        added_at:
          type: string
        notes:
          type: string
        has_latest_warning:
          type: boolean
        latest_warning:
          $ref: "#/components/schemas/WatchlistLatestWarning"
    WatchlistLatestWarning:
      type: object
      additionalProperties: false
      required:
        - date
        - warning_level
        - calibrated_risk_probability
        - trust_score
      properties:
        date:
          type: string
        warning_level:
